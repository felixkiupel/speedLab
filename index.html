<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>speedLab</title>
<meta name="description" content="speedLab – kleine Browser-Spiele mit gemeinsamen Coins und einer täglichen Serie.">
<meta name="theme-color" content="#fbf7f0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='56' fill='%232b2420'/%3E%3Ccircle cx='43' cy='52' r='14.6' fill='%23fbf7f0'/%3E%3Ccircle cx='77' cy='52' r='14.6' fill='%23fbf7f0'/%3E%3Ccircle cx='43' cy='52' r='6.7' fill='%232b2420'/%3E%3Ccircle cx='77' cy='52' r='6.7' fill='%232b2420'/%3E%3C/svg%3E">
<link rel="stylesheet" href="shared/css/base.css">
<link rel="stylesheet" href="hub/hub.css">
</head>
<body>
<div class="hub-backdrop" aria-hidden="true"></div>
<main class="hub">

  <header class="hub-top">
    <div class="coin-pill"><span class="coin-icon" aria-hidden="true"></span><span id="hub-coins">0</span></div>
  </header>

  <!-- Logo + Figur. Die Figur schaut dem Mauszeiger hinterher (hub.js), Klick lässt sie hüpfen. -->
  <section class="hub-hero">
    <div id="hub-mascot-stage" class="hub-mascot-stage">
      <button id="hub-mascot" class="mascot face brand-mascot hub-mascot" type="button" aria-label="Hallo!">
        <span class="eye left"></span><span class="eye right"></span>
      </button>
    </div>
    <div class="logo">
      <h1 class="logo-word" aria-label="speedLab"><span class="logo-speed">speed</span><span class="logo-lab">Lab</span></h1>
      <div class="logo-tag">Games</div>
    </div>
    <p class="tagline">Kleine Spiele. Schnelle Runden.</p>
  </section>

  <!-- Spielübergreifende Daily-Serie: Flamme + Zahl, die letzten 7 Tage, heutiger Stand.
       Inhalt setzt hub.js (renderStreak). -->
  <section id="streak-card" class="streak-card" aria-label="Tägliche Serie">
    <div class="streak-head">
      <span class="streak-flame" aria-hidden="true">
        <svg viewBox="0 0 32 40"><path d="M16 1C17.6 7 23.2 10.2 26.6 16C30 21.8 30.2 28 27.2 32.8C24.7 36.9 20.6 39 16 39C11.4 39 7.3 36.9 4.8 32.8C2 28.2 2.4 22.2 6 17.4C7.2 20.8 9 22.4 11.2 23C10.2 16.4 12.2 7.6 16 1Z"/></svg>
        <b id="streak-count" class="streak-count"></b>
      </span>
      <span class="streak-text">
        <span class="streak-kicker">Tägliche Serie</span>
        <span id="streak-label" class="streak-label"></span>
        <span id="streak-best" class="streak-best"></span>
      </span>
      <span id="streak-week" class="streak-week"></span>
    </div>
    <p id="streak-foot" class="streak-foot"></p>
  </section>

  <section class="hub-section" aria-labelledby="games-title">
    <header class="hub-section-head">
      <h2 id="games-title">Spiele</h2>
      <span id="games-count" class="kicker"></span>
    </header>
    <div id="game-grid" class="game-grid"></div>
  </section>

  <!-- Credits - PLATZHALTER: Name, Jahr und Links vor dem Veröffentlichen anpassen -->
  <footer class="hub-foot">
    <div class="foot-brand">
      <span class="mascot face foot-mascot" aria-hidden="true"><span class="eye left"></span><span class="eye right"></span></span>
      <span class="foot-credits">
        <span class="foot-logo"><span class="logo-speed">speed</span><span class="logo-lab">Lab</span></span>
        <span>© 2026 · Gemacht von <b>Dein Name</b></span>
      </span>
    </div>
    <nav class="foot-links" aria-label="Links">
      <a href="#">GitHub</a>
      <a href="#">Kontakt</a>
    </nav>
  </footer>

</main>

<script src="shared/js/links.js"></script>
<script src="shared/js/days.js"></script>
<script src="shared/js/profile.js"></script>
<script src="shared/js/games.js"></script>
<script src="hub/hub.js"></script>
</body>
</html>
