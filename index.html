<title>speedLab</title>
<meta name="description" content="speedLab – kleine Browser-Spiele mit gemeinsamen Coins und einer täglichen Serie.">
<meta name="theme-color" content="#fbf7f0">

<body>
<div class="hub-backdrop" aria-hidden="true"></div>
<main class="hub">

  <header class="hub-top">
    <div class="coin-pill"><span class="coin-icon" aria-hidden="true"></span><span id="hub-coins">0</span></div>
  </header>

  <!-- Logo + Figur. Die Figur schaut dem Mauszeiger hinterher (hub.js), Klick lässt sie hüpfen. -->

    <div id="hub-mascot-stage" class="hub-mascot-stage">
      <button id="hub-mascot" class="mascot face brand-mascot hub-mascot" type="button" aria-label="Hallo!">
        <span class="eye left"></span><span class="eye right"></span>
      </button>
    </div>
    <div class="logo">
      <h1 class="logo-word" aria-label="speedLab"><span class="logo-speed">speed</span><span class="logo-lab">Lab</span></h1>
      <div class="logo-tag">Games</div>
    </div>
    <p class="tagline">Kleine Spiele. Schnelle Runden.</p>
  </section>

       Inhalt setzt hub.js (renderStreak). -->

           jede in eigenem Takt - dadurch züngelt sie. Dazu Zungen, die oben abreißen, Funken und

           Stil der Zustände (keine Serie / heute noch offen) in hub.css. -->

                        M14.8 1.8C16.4 7.8 23.2 10.2 26.6 16C30 21.8 30.2 28 27.2 32.8C24.7 36.9 20.6 39 16 39C11.4 39 7.3 36.9 4.8 32.8C2 28.2 2.4 22.2 5.6 16.8C6.8 20.2 9 22.4 11.2 23C10.2 16.4 11 8.4 14.8 1.8Z;
                        M16 1C17.6 7 23.2 10.2 26.6 16C30 21.8 30.2 28 27.2 32.8C24.7 36.9 20.6 39 16 39C11.4 39 7.3 36.9 4.8 32.8C2 28.2 2.4 22.2 6 17.4C7.2 20.8 9 22.4 11.2 23C10.2 16.4 12.2 7.6 16 1Z"/>
            </path>
          </g>
          <g class="flame-sparks">
            <circle class="flame-spark spark-a" r="0.9"/>
            <circle class="flame-spark spark-b" r="0.7"/>
            <circle class="flame-spark spark-c" r="0.8"/>
          </g>
        </svg>
        <b id="streak-count" class="streak-count"></b>
      </span>
      <span class="streak-text">
        <span class="streak-kicker">Tägliche Serie</span>
        <span id="streak-label" class="streak-label"></span>
        <span id="streak-best" class="streak-best"></span>
      </span>
      <span id="streak-week" class="streak-week"></span>
    </div>
    <p id="streak-foot" class="streak-foot"></p>
  </section>

  <section class="hub-section" aria-labelledby="games-title">
    <header class="hub-section-head">
      <h2 id="games-title">Spiele</h2>
      <span id="games-count" class="kicker"></span>
    </header>
    <div id="game-grid" class="game-grid"></div>
  </section>

  <!-- Credits - PLATZHALTER: Name, Jahr und Links vor dem Veröffentlichen anpassen -->

    <div class="foot-brand">
      <span class="mascot face foot-mascot" aria-hidden="true"><span class="eye left"></span><span class="eye right"></span></span>
