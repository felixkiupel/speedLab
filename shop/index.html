<!DOCTYPE html>

<head>

<div id="app">

  <!-- Ein einziger Screen im selben Gerüst wie die Spielseiten. Gescrollt wird im Screen, die
       Kopfzeile bleibt dabei oben stehen. "Zurück" biegt shop.js auf das Spiel um, aus dem man kam. -->
  <section class="screen active shop-screen">
    <header class="topbar shop-topbar">
      <a id="shop-back" class="btn btn-ghost btn-back" href="../">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Alle Spiele
      </a>
      <h2>Shop</h2>
      <div class="coin-pill"><span class="coin-icon" aria-hidden="true"></span><span id="shop-coins">0</span></div>
    </header>
    <!-- Inhalt setzt shop.js: Dein Look, darunter je Kategorie alle Items -->
    <div id="shop" class="shop"></div>
  </section>

</div>

<script src="../shared/js/links.js"></script>
