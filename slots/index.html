<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>speedLab Slots</title>
<meta name="description" content="speedLab Slots – tausch Coins am Automaten gegen Kristalle.">
<meta name="theme-color" content="#fbf7f0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='56' fill='%232b2420'/%3E%3Ccircle cx='43' cy='52' r='14.6' fill='%23fbf7f0'/%3E%3Ccircle cx='77' cy='52' r='14.6' fill='%23fbf7f0'/%3E%3Ccircle cx='43' cy='52' r='6.7' fill='%232b2420'/%3E%3Ccircle cx='77' cy='52' r='6.7' fill='%232b2420'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../shared/css/base.css?v=dad0be95">
<link rel="stylesheet" href="../shared/css/game.css?v=50a3b4ca">
<link rel="stylesheet" href="slots.css?v=8b2d2e61">
</head>
<body>
<div id="app">

  <!-- Ein Screen im Gerüst der Spielseiten. "Zurück" führt in den Shop (slots.js reicht ?from=
       weiter, damit man von dort ins richtige Spiel zurückkommt). -->
  <section class="screen active slots-screen">
    <header class="topbar">
      <a id="slots-back" class="btn btn-ghost btn-back" href="../shop/" aria-label="Zurück zum Shop">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="btn-back-label">Shop</span>
      </a>
      <h2>Slots</h2>
      <div class="coin-pill wallet-pill">
        <span aria-label="Coins"><span class="coin-icon" aria-hidden="true"></span><span id="wallet-coins">0</span></span>
        <span aria-label="Kristalle"><span class="crystal-icon" aria-hidden="true"></span><span id="wallet-crystals">0</span></span>
      </div>
    </header>

    <!-- Handy: Automat und Gewinntabelle untereinander, PC: nebeneinander (slots.css) -->
    <div class="slots">
      <!-- Der Automat. Gedreht wird per Knopf oder Leertaste; noch mal drücken, während die
           Walzen laufen, stoppt sie schneller. Die Figur schaut oben übers Gehäuse. -->
      <div id="slot-stage" class="slot-stage">
        <span class="mascot face slot-mascot" aria-hidden="true"><span class="eye left"></span><span class="eye right"></span></span>
        <div id="slot-machine" class="slot-machine">
          <div class="slot-brand">
            <div class="logo-word slot-logo" aria-label="speedSlots"><span class="logo-speed">speed</span><span class="logo-lab">Slots</span></div>
            <div class="logo-tag">Kristall-Automat</div>
          </div>

          <div class="slot-window">
            <p id="slot-message" class="slot-message" role="status"></p>
            <div class="slot-reels-wrap">
              <canvas id="slot-reels" aria-label="Walzen"></canvas>
            </div>
            <div class="slot-displays">
              <span class="slot-display">Einsatz <b id="slot-stake">40</b></span>
              <span id="slot-win-box" class="slot-display">Gewinn <b id="slot-win">--</b></span>
            </div>
          </div>

          <div class="slot-controls">
            <div class="slot-control">
              <div id="slot-stakes" class="slot-stakes" role="group" aria-label="Einsatz"></div>
              <span class="slot-caption">Einsatz</span>
            </div>
            <div class="slot-control">
              <button id="slot-spin" class="slot-spin" type="button" aria-label="Drehen"></button>
              <span id="slot-spin-label" class="slot-caption">Dreh</span>
            </div>
          </div>

          <div class="slot-bottom">
            <button id="slot-sound" class="slot-toggle" type="button"></button>
            <!-- Lautsprecher-Gitter = Lauflichter: beim Drehen wandert ein Licht, bei Gewinn
                 blinkt alles in Holo-Silber. --i = Nummer der Lampe. -->
            <div class="slot-lights" aria-hidden="true">
              <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:13"></i><i style="--i:12"></i><i style="--i:11"></i><i style="--i:10"></i><i style="--i:9"></i><i style="--i:8"></i><i style="--i:7"></i>
            </div>
          </div>
        </div>
      </div>

      <section class="slot-paytable" aria-labelledby="paytable-title">
        <header class="paytable-head">
          <h3 id="paytable-title"><span class="narrow-only">Gewinne</span><span class="wide-only">Gewinntabelle</span></h3>
          <span id="paytable-stake"></span>
        </header>
        <div id="paytable" class="paytable"></div>
        <p id="paytable-note" class="paytable-note"></p>
      </section>
    </div>
  </section>

</div>

<!-- Partikel und Konfetti über der ganzen Seite -->
<canvas id="slot-fx" class="slot-fx" aria-hidden="true"></canvas>

<script src="../shared/js/no-zoom.js?v=52f11a77"></script>
<script src="../shared/js/links.js?v=86a0b5d1"></script>
<script src="../shared/js/days.js?v=b36a7d57"></script>
<script src="../shared/js/profile.js?v=61810907"></script>
<script src="../shared/js/rng.js?v=16d91e8a"></script>
<script src="../shared/js/audio.js?v=9819aa53"></script>
<script src="../shared/js/effects.js?v=2e81e6a0"></script>
<script src="machine.js?v=aa3c2bf1"></script>
<script src="sounds.js?v=e8ddb313"></script>
<script src="slots.js?v=ee15cd0a"></script>
</body>
</html>
